<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbo Food - Administración</title>
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <main class="login-container">

        <img src="assets/Logo turbo food.jpeg" alt="Turbo Food" class="logo">

        <h1>Panel de Administración</h1>
        <p>Ingresá con tu cuenta para gestionar los pedidos.</p>

        <form id="login-form">

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" placeholder="admin@ejemplo.com" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" placeholder="Ingresá tu contraseña" required>

            <button type="submit" id="login-button">
                Iniciar sesión
            </button>

            <p id="login-message"></p>

        </form>

        <a href="index.html" class="back-link">Volver al menú</a>

    </main>

    <section id="admin-dashboard" class="dashboard-container" hidden>

        <header class="dashboard-header">
            <div>
                <h1>Gestión de pedidos</h1>
                <p>Panel de control de Turbo Food</p>
            </div>

            <button id="logout-button" class="logout-button">
                Cerrar sesión
            </button>
        </header>

        <div class="dashboard-actions">
            <h2>Pedidos recibidos</h2>
            <button id="refresh-button">Actualizar pedidos</button>
        </div>

        <div id="orders-container">
            <p>Cargando pedidos...</p>
        </div>

    </section>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/admin.js"></script>

</body>

</html>
